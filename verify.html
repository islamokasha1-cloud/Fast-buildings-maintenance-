<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>التحقّق من خطاب — شركة المباني السريعة للمقاولات</title>
<!-- ═══════════════════════════════════════════════════════════════════════
     صفحةُ التحقّق من الخطاب الصادر — يفتحها رمزُ QR المطبوعُ على الخطاب.

     ── ما تفعله ──
     تقرأ الرمزَ العشوائيَّ من الرابط (`?t=…`)، تدخل Firebase **مجهولةً** (كتطبيق
     الفنيين — لا حسابَ ولا كلمةَ سرّ)، وتجلب **مستنداً واحداً** من `letter_verify`
     بهذا الرمز. فإن وُجد عرضت: رقمَ الخطاب وتاريخَه وجهتَه وموضوعَه وموقّعَه — وهي
     ما يقرؤه حاملُ الورقة بعينه — ولا تعرض متناً ولا مرفقاً. وإن لم يوجد قالت ذلك.

     ── ما لا تفعله عمداً ──
     لا تستعلم مجموعةً، ولا تقبل رمزاً بغير شكله القياسيّ، ولا تحمل روابطَ إلى
     المنصّة. صفحةٌ ساكنةٌ بلا حالةٍ تُجاور `index.html` على المضيف نفسِه، ولا
     تُحدَّث إلا مع تغييرٍ في ما يُعرَض. التفصيلُ في ترويسة `doc-vault.js` (قسمُ
     التحقّق) وفي `NOTES.md §6`.
     ═══════════════════════════════════════════════════════════════════════ -->
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-auth-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-check-compat.js" crossorigin="anonymous"></script>
<style>
  :root{ --navy:#1b3a6b; --ink:#111827; --muted:#64748b; --line:#e5e7eb; --ok:#166534; --ok-bg:#f0fdf4; --bad:#991b1b; --bad-bg:#fef2f2; --warn:#92400e; --warn-bg:#fffbeb; }
  *{ box-sizing:border-box }
  body{ margin:0; font-family:"Segoe UI",Tahoma,Arial,sans-serif; background:#f3f4f6; color:var(--ink); line-height:1.9; padding:20px 16px; min-height:100vh }
  .card{ max-width:560px; margin:0 auto; background:#fff; border-radius:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); overflow:hidden }
  .head{ display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:3px solid var(--navy) }
  .head img{ width:48px; height:48px; object-fit:contain }
  .co{ font-weight:800; font-size:16px }
  .sub{ font-size:12.5px; color:var(--navy); font-weight:700 }
  .body{ padding:18px 20px 22px }
  .badge{ display:flex; align-items:center; gap:10px; border-radius:10px; padding:12px 14px; font-weight:800; font-size:15px; margin-bottom:16px }
  .badge.ok{ background:var(--ok-bg); color:var(--ok); border:1px solid #bbf7d0 }
  .badge.bad{ background:var(--bad-bg); color:var(--bad); border:1px solid #fecaca }
  .badge.wait{ background:#f8fafc; color:var(--muted); border:1px solid var(--line) }
  .badge .ic{ font-size:22px; line-height:1 }
  .rows{ display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:14px }
  .rows .l{ color:var(--muted); font-weight:700; white-space:nowrap }
  .num{ font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; display:inline-block }
  .id{ font-size:17px; font-weight:800; color:var(--navy); letter-spacing:.5px }
  .note{ margin-top:18px; padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted) }
  .chip{ display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px; background:var(--warn-bg); color:var(--warn); border:1px solid #fde68a; margin-inline-start:8px; vertical-align:middle }
  button{ font:inherit; background:var(--navy); color:#fff; border:0; border-radius:8px; padding:8px 18px; font-weight:700; cursor:pointer; margin-top:10px }
  .tok{ font-size:11.5px; color:var(--muted); word-break:break-all }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <img src="logo.png" alt="">
    <div>
      <div class="co">شركة المباني السريعة للمقاولات</div>
      <div class="sub">التحقّق من صدور خطاب رسميّ<span id="dev-chip" class="chip" hidden>بيئة تجريبية</span></div>
    </div>
  </div>
  <div class="body" id="out">
    <div class="badge wait"><span class="ic">⏳</span><span>جارٍ التحقّق…</span></div>
  </div>
</div>

<script>
(function(){
"use strict";
/* الإعداداتُ نفسُها التي يحملها `index.html` و`tech-app.html` — عامةٌ بطبعها،
   والحمايةُ في قواعد Firestore وApp Check لا في إخفائها. */
var firebaseConfig = {
  apiKey: "AIzaSyC9o0JvWbgrZGF8a_Ra6hCJhY7ctcH5nOQ",
  authDomain: "fast-buildings.firebaseapp.com",
  projectId: "fast-buildings",
  storageBucket: "fast-buildings.firebasestorage.app",
  messagingSenderId: "960496206275",
  appId: "1:960496206275:web:cbe818b15601c307d0bd76"
};
var RECAPTCHA_SITE_KEY = "6Lf-MEQtAAAAAAcvx6wGbqjS5OLeKK4m4sNXrCqJ";
var TOKEN_RE = /^[A-HJ-NP-Z2-9]{20}$/;

function esc(v){ return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
function q(k){ try{ return new URLSearchParams(location.search).get(k) || ""; }catch(e){ return ""; } }
var out = document.getElementById("out");
function show(html){ out.innerHTML = html; }
function badge(kind, ic, text){ return '<div class="badge ' + kind + '"><span class="ic">' + ic + '</span><span>' + text + '</span></div>'; }
function row(l, v){ return '<div class="l">' + l + '</div><div>' + v + '</div>'; }

var token = String(q("t") || "").trim().toUpperCase();
var dev = q("d") === "1";
var COLL = dev ? "letter_verify_dev" : "letter_verify";
if(dev){ try{ document.getElementById("dev-chip").hidden = false; }catch(e){} }

if(!TOKEN_RE.test(token)){
  show(badge("bad", "✕", "رابطٌ غير صالح")
    + '<div class="note">امسح رمزَ QR المطبوعَ على الخطاب مرّةً أخرى، أو اكتب الرابطَ كما هو دون تغيير.</div>');
  return;
}

function render(d){
  var sig = (d.signTitle ? d.signTitle + ": " : "") + (d.signName || "");
  show(badge("ok", "✔", "خطابٌ صادرٌ عن الشركة")
    + '<div class="rows">'
    + row("رقم الخطاب", '<span class="num id">' + esc(d.letterId || "—") + '</span>')
    + row("تاريخ الخطاب", '<span class="num">' + esc(d.letterDate || "—") + '</span>')
    + row("الجهة الموجَّه إليها", esc(d.party || "—"))
    + row("الموضوع", esc(d.subject || "—"))
    + row("الموقّع", sig ? esc(sig) : '<span style="color:var(--muted)">—</span>')
    + '</div>'
    + '<div class="note">تحقّق أنّ الرقمَ والتاريخَ والجهةَ على الورقة التي بين يديك <b>تطابق</b> ما هنا. '
    + 'هذه الصفحة تُثبت صدورَ الخطاب ببياناته أعلاه ولا تعرض متنَه ولا مرفقاتِه.'
    + '<div class="tok">رمز التحقّق: <span class="num">' + esc(token) + '</span></div></div>');
}
function notFound(){
  show(badge("bad", "✕", "لم يُعثر على خطابٍ بهذا الرمز")
    + '<div class="note">إمّا أنّ الرابطَ نُقل ناقصاً، أو أنّ الخطابَ لم يُصدَر عن الشركة. '
    + 'للتأكّد تواصل مع الشركة مباشرةً بذكر رقم الخطاب المطبوع.'
    + '<div class="tok">رمز التحقّق: <span class="num">' + esc(token) + '</span></div></div>');
}
function failed(e){
  show(badge("bad", "!", "تعذّر الاتصال بخدمة التحقّق")
    + '<div class="note">' + esc((e && e.code) || "") + ' — تحقّق من الاتصال بالإنترنت ثمّ أعد المحاولة.'
    + '<br><button type="button" onclick="location.reload()">إعادة المحاولة</button></div>');
}

try{
  firebase.initializeApp(firebaseConfig);
  try{ firebase.appCheck().activate(new firebase.appCheck.ReCaptchaEnterpriseProvider(RECAPTCHA_SITE_KEY), true); }
  catch(e){ try{ console.warn("AppCheck:", e); }catch(_){} }
  var db = firebase.firestore();
  var ready = new Promise(function(res, rej){
    var off = firebase.auth().onAuthStateChanged(function(u){
      off();
      if(u) res(u); else firebase.auth().signInAnonymously().then(res, rej);
    }, rej);
  });
  ready.then(function(){ return db.collection(COLL).doc(token).get(); })
    .then(function(snap){ if(snap.exists) render(snap.data() || {}); else notFound(); })
    .catch(function(e){
      /* رفضُ القواعد لمستندٍ غائبٍ يصل أحياناً «permission-denied» لا «غير موجود» —
         والحكمُ للمستخدم واحد: لا خطابَ بهذا الرمز. */
      if(e && e.code === "permission-denied") notFound(); else failed(e);
    });
}catch(e){ failed(e); }
})();
</script>
</body>
</html>
