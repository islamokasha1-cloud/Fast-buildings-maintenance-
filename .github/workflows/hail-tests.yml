name: Hail Tests

on:
  push:
    paths:
      # كل ملفٍ يفحصه hail-tests — أي إغفال يعني أن push مباشراً له لا يُشغّل CI.
      - 'index.html'
      - 'labor-catalog.js'
      - 'price-analysis.js'
      - 'stocktake.js'
      - 'substitute-budget.js'
      - 'HailNotify.js'
      - 'hail-tests.js'
      - '.github/workflows/hail-tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Logic and guard checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jsdom
        run: npm install jsdom --silent --no-save

      - name: Run tests
        run: node hail-tests.js
