name: Hail Tests

on:
  push:
    paths:
      # كل ملفٍ يفحصه hail-tests — أي إغفال يعني أن push مباشراً له لا يُشغّل CI.
      - 'index.html'
      - 'app.css'
      - 'labor-catalog.js'
      - 'price-analysis.js'
      - 'stocktake.js'
      - 'inventory-reports.js'
      - 'substitute-budget.js'
      - 'project-management.js'
      - 'cleaning-operations.js'
      - 'performance-contract.js'
      - 'finance-audit.js'
      - 'hr-payments.js'
      - 'contracts.js'
      - 'HailNotify.js'
      - 'photo-queue.js'
      - 'operations-wall.js'
      - 'hail-tests.js'
      - 'global-surface-check.mjs'
      - 'css-surface-check.mjs'
      - 'sync-version.mjs'
      - 'firestore.rules'
      - 'rules-check.mjs'
      - 'wa-routing-check.mjs'
      - 'functions/**'
      - 'worker/**'
      - 'tech-app.html'
      - '.github/workflows/hail-tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Logic and guard checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jsdom
        run: npm install jsdom --silent --no-save

      # ختمُ الإصدار: فحصُ اتّساقٍ داخليٌّ لا يلمس git — Actions تفحص commit دمجٍ
      # للـPR فيختلف عدّادُه عمّا كان لدى المطوّر، وربطُ الفحص بالعدّاد يُسقط الـPR
      # بلا خطأٍ حقيقيّ. المولِّد (npm run stamp) وحده يقرأ git، ومحلّياً فقط.
      - name: Version stamp check
        run: node sync-version.mjs --check

      - name: Run tests
        run: node hail-tests.js

      # طبقةُ التوجيه الخادمية — تنفيذاً لا مطابقةَ نصوص. لا شبكةَ ولا متصفّحَ ولا
      # Java، فتُشغَّل هنا مع بقية الفحوص. وأخطاؤها صامتةٌ بطبعها: مستلمٌ لا يُوجَد
      # أو خانةٌ زائدة — لا يظهر منها شيءٌ في النظام، والرسالةُ لا تصل فحسب.
      - name: WhatsApp routing check
        run: node wa-routing-check.mjs

  rules:
    name: Firestore security rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # محاكي Firestore يعمل على الـJVM — بلا Java لا فحصَ للقواعد أصلاً.
      # و**21 حدٌّ أدنى لا اختيار**: firebase-tools يرفض ما دونها صراحةً
      # («no longer supports Java version before 21»).
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install emulator and test SDK
        run: npm install firebase-tools @firebase/rules-unit-testing firebase --silent --no-save

      # القاعدةُ الأمنيةُ لا تُختبَر بقراءة سطرها: تُقيَّم بـ«أو» عبر كل البلوكات
      # المتطابقة. فالفحصُ الوحيدُ المعتبَر هو الكتابةُ بدورٍ معيّن على محاكٍ حقيقيّ.
      - name: Rules check
        run: npx firebase-tools emulators:exec --only firestore --project hail-rules-check "node rules-check.mjs"
